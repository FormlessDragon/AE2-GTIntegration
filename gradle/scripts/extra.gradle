import java.util.zip.ZipFile

// You may write any Gradle buildscript component in this file.
// This file is automatically applied after build.gradle + dependencies.gradle.

def minecraftVersion = '1.12.2'
def cleanroomVersion = '0.6.13-alpha'

// The runtime-test workflow intentionally keeps its original staging and
// installation flow. These tasks provide the same contract for ModDevGradle.
apply plugin: 'com.diffplug.spotless'

def cleanroomInstaller = configurations.maybeCreate('cleanroomInstaller')
cleanroomInstaller.canBeConsumed = false
cleanroomInstaller.canBeResolved = true
dependencies.add(cleanroomInstaller.name, "com.cleanroommc:cleanroom:${cleanroomVersion}:installer") {
    transitive = false
}

def productionJarTask = tasks.named(propertyBool('enable_shadow') ? 'reobfShadowJar' : 'reobfJar')
def runtimeTestProductionMods = configurations.maybeCreate('runtimeTestProductionMods')
runtimeTestProductionMods.canBeConsumed = false
runtimeTestProductionMods.canBeResolved = true
runtimeTestProductionMods.extendsFrom(
    configurations.getByName('modImplementation'),
    configurations.getByName('modRuntimeOnly'),
    configurations.getByName('modApi')
)
def mappingsAttribute = Attribute.of(
    'com.gtnewhorizons.retrofuturagradle.obfuscation',
    String
)
def runtimeProductionAttributes = {
    attribute(mappingsAttribute, 'srg')
    attribute(
            Usage.USAGE_ATTRIBUTE,
        objects.named(Usage, 'java-runtime')
    )
}
runtimeTestProductionMods.attributes(runtimeProductionAttributes)

def runtimeTestReobfMods = configurations.maybeCreate('runtimeTestReobfMods')
runtimeTestReobfMods.canBeConsumed = false
runtimeTestReobfMods.canBeResolved = true
runtimeTestReobfMods.attributes(runtimeProductionAttributes)

def runtimeTestNamedModJars = configurations.maybeCreate('runtimeTestNamedModJars')
runtimeTestNamedModJars.canBeConsumed = false
runtimeTestNamedModJars.canBeResolved = true

runtimeTestProductionMods.allDependencies
    .withType(ExternalModuleDependency)
    .each { dependency ->
        if (!dependency.artifacts.any { it.classifier == 'dev' }) {
            return
        }
        dependencies.add(
            runtimeTestReobfMods.name,
            "${dependency.group}:${dependency.name}:${dependency.version}"
        ) {
            transitive = false
        }
        dependencies.add(
            runtimeTestNamedModJars.name,
            "${dependency.group}:${dependency.name}:${dependency.version}:dev@jar"
        ) {
            transitive = false
        }
    }

def namedRuntimeTestJarNames = providers.provider {
    runtimeTestNamedModJars.files.collect { it.name } as Set
}
def isNamedRuntimeTestJar = { String fileName ->
    namedRuntimeTestJarNames.get().contains(fileName)
}

def remappedRuntimeTestModsDir =
    layout.buildDirectory.dir('runtime-test/remapped-mods')
def isNamedMinecraftJar = { File jar ->
    def srgNames = new HashSet<String>()
    def mcRefs = new HashSet<String>()
    def zf = new ZipFile(jar)
    try {
        zf.entries().each { entry ->
            if (!entry.name.endsWith('.class')) {
                return
            }
            def text = new String(
                zf.getInputStream(entry).withCloseable { it.getBytes() },
                'ISO-8859-1'
            )
            def srgMatcher = text =~ /(?:func|field)_\d+_[A-Za-z0-9_]+/
            srgMatcher.each { srgNames << it }
            def mcMatcher = text =~ /net\/minecraft\/[a-zA-Z0-9_\/]+/
            mcMatcher.each { mcRefs << it }
        }
    } finally {
        zf.close()
    }
    if (mcRefs.isEmpty()) {
        return false
    }
    return srgNames.size() * 2 < mcRefs.size()
}
def namedRuntimeTestJars = {
    def substituted = namedRuntimeTestJarNames.get()
    runtimeTestProductionMods.files.findAll {
        it.name.endsWith('.jar') &&
            !it.name.endsWith('-sources.jar') &&
            !substituted.contains(it.name) &&
            isNamedMinecraftJar(it)
    }
}

def cleanRemappedRuntimeTestMods = tasks.register(
    'runtimeTestCleanRemappedMods',
    Delete
) {
    delete remappedRuntimeTestModsDir
}

def namedRuntimeTestRemapTasks = []
afterEvaluate {
    def remapJarType = tasks.getByName('reobfJar').class
    namedRuntimeTestJars().each { jar ->
        def remapTask = tasks.register(
            'runtimeTestRemap' + jar.name.replaceAll('[^A-Za-z0-9]', '_'),
            remapJarType
        ) { task ->
            task.dependsOn cleanRemappedRuntimeTestMods
            task.input = layout.file(providers.provider { jar })
            task.archiveFileName.set(jar.name)
            task.destinationDirectory.set(remappedRuntimeTestModsDir)
            task.libraries.from(sourceSets.main.compileClasspath)
            obfuscation.configureNamedToSrgOperation(task.remapOperation)
        }
        namedRuntimeTestRemapTasks << remapTask
    }
}

def remapNamedRuntimeTestMods = tasks.register('runtimeTestRemapNamedMods') {
    dependsOn cleanRemappedRuntimeTestMods
    dependsOn namedRuntimeTestRemapTasks
    outputs.dir(remappedRuntimeTestModsDir)
    doLast {
        logger.lifecycle(
            "[RuntimeTest] Remapped ${namedRuntimeTestRemapTasks.size()} named " +
                'jar(s) to SRG'
        )
    }
}
def runtimeTestModsDir = providers.gradleProperty('runtimeTestModsDir')
    .map { file(it) }
    .orElse(layout.buildDirectory.dir('runtime-test/instance/mods'))
def runtimeTestMinecraftDir = providers.gradleProperty('runtimeTestMinecraftDir')
    .map { file(it) }
    .orElse(layout.buildDirectory.dir('runtime-test/minecraft'))
def runtimeTestSupportDir = layout.buildDirectory.dir('runtime-test/support')
def runtimeTestClientModsDir = layout.buildDirectory.dir('runtime-test/client-mods')
def runtimeMcpRemapMarker = layout.buildDirectory.file(
    'runtime-test/runtime-mcp-remap.marker'
)

def runtimeMcpRemapTask = tasks.register('runtimeTestRemapMcp') {
    dependsOn remapNamedRuntimeTestMods
    inputs.files(runtimeTestProductionMods)
    inputs.files(runtimeTestNamedModJars)
    inputs.files(runtimeTestReobfMods)
    inputs.dir(remappedRuntimeTestModsDir)
    inputs.property('runtimeRemapSchema', 'moddevgradle-runtime-production-variants-v3')
    outputs.file(runtimeMcpRemapMarker)
    doLast {
        def dropped = namedRuntimeTestJars()
        def substituted = namedRuntimeTestJarNames.get()
        def files = runtimeTestProductionMods.files.findAll {
            it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar')
        }.findAll { !dropped.any { d -> d.name == it.name } }
            .findAll { !substituted.contains(it.name) }
        def reobfFiles = runtimeTestReobfMods.files.findAll {
            it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar')
        }
        def remappedFiles = remappedRuntimeTestModsDir.get().asFile.listFiles()
            ?.findAll { it.name.endsWith('.jar') } ?: []
        runtimeMcpRemapMarker.get().asFile.with {
            parentFile.mkdirs()
            text = (files + reobfFiles + remappedFiles)
                .collect { it.name }.sort().join('\n') + '\n'
        }
        logger.lifecycle(
            "[RuntimeTest] Production variants: ${files.size()}, " +
                "reobfuscated substitutions: ${reobfFiles.size()}, " +
                "remapped: ${remappedFiles.size()}"
        )
    }
}

tasks.register('stageRuntimeTestMods', Sync) {
    dependsOn productionJarTask
    dependsOn runtimeMcpRemapTask
    from(productionJarTask.flatMap { it.archiveFile })
    from(runtimeTestProductionMods) {
        include '*.jar'
        exclude '*-sources.jar'
        exclude { isNamedRuntimeTestJar(it.name) }
        exclude {
            it.file.name.endsWith('.jar') && isNamedMinecraftJar(it.file)
        }
    }
    from(runtimeTestReobfMods) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    from(remappedRuntimeTestModsDir) {
        include '*.jar'
    }
    into(runtimeTestModsDir)
    include '*.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('stageRuntimeTestClientMods', Sync) {
    dependsOn 'stageRuntimeTestMods'
    from(runtimeTestSupportDir) {
        include '*.jar'
    }
    into(runtimeTestClientModsDir)
    include '*.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('installRuntimeTestClient', JavaExec) {
    dependsOn cleanroomInstaller
    dependsOn 'stageRuntimeTestClientMods'
    classpath = cleanroomInstaller
    mainClass = 'net.minecraftforge.installer.SimpleInstaller'
    def installDir = runtimeTestMinecraftDir.get().asFile
    def profile = new File(
        installDir,
        "versions/${minecraftVersion}-Cleanroom-${cleanroomVersion}/" +
        "${minecraftVersion}-Cleanroom-${cleanroomVersion}.json"
    )
    def cleanroomJar = new File(
        installDir,
        "libraries/com/cleanroommc/cleanroom/${cleanroomVersion}/" +
        "cleanroom-${cleanroomVersion}.jar"
    )
    def marker = layout.buildDirectory.file('runtime-test/cleanroom-client-installed.marker').get().asFile
    onlyIf {
        !marker.exists()
            || marker.text.trim() != "${minecraftVersion}-Cleanroom-${cleanroomVersion}"
            || !profile.isFile()
            || !cleanroomJar.isFile()
    }
    doFirst {
        installDir.mkdirs()
        def launcherProfiles = new File(installDir, 'launcher_profiles.json')
        if (!launcherProfiles.exists()) {
            launcherProfiles.text = '{"profiles":{},"selectedProfile":""}'
        }
        args '--install-client', installDir.absolutePath
    }
    doLast {
        marker.parentFile.mkdirs()
        marker.text = "${minecraftVersion}-Cleanroom-${cleanroomVersion}\n"
    }
}

tasks.register('printRuntimeTestPaths') {
    doLast {
        println "runtimeTestModsDir=${runtimeTestModsDir.get().asFile.absolutePath}"
        println "runtimeTestMinecraftDir=${runtimeTestMinecraftDir.get().asFile.absolutePath}"
        println "runtimeTestProductionMods=${runtimeTestProductionMods.files*.absolutePath}"
        println "runtimeTestReobfMods=${runtimeTestReobfMods.files*.absolutePath}"
        println "runtimeTestNamedModJars=${runtimeTestNamedModJars.files*.absolutePath}"
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        leadingTabsToSpaces()
        endWithNewline()
        removeUnusedImports()
    }
}

// ---------------------------------------------------------------------------
// AE2-GTIntegration additions
// ---------------------------------------------------------------------------

// Cleanroom loads dev-time mixin configs from this system property.
// `mixin_configs` is a comma-delimited list; mirror it here.
def mixinConfigList = propertyBool('use_mixins')
    ? propertyStringList('mixin_configs', ',').join(',')
    : ''

if (!mixinConfigList.isEmpty()) {
    mcpForge {
        runs {
            configureEach {
                systemProperty 'crl.dev.mixin', mixinConfigList
            }
        }
    }

    // Forge/Cleanroom discovers production mixin configs through the jar manifest.
    // The template's manifest helper does not emit this attribute.
    tasks.named('jar').configure {
        doFirst {
            manifest {
                attributes('MixinConfigs': mixinConfigList)
            }
        }
    }
}

// ---------------------------------------------------------------------------
// GregTech CE: Unofficial dev-time mapping bridge
// ---------------------------------------------------------------------------
// GTCEU's ASM coremod builds its SRG->MCP dictionaries at class-load time from
// two ForgeGradle-2 system properties whenever the game runs un-obfuscated:
//
//   net.minecraftforge.gradle.GradleStart.srg.notch-srg : an .srg file
//   net.minecraftforge.gradle.GradleStart.csvDir        : a directory holding
//                                                         fields.csv + methods.csv
//
// gregtech.asm.util.ObfMapping$MCPRemapper#getConfFiles() existence-checks the
// first and actually parses the two CSVs; if any of the three paths is missing
// it throws RuntimeException("Failed to grab mappings from GradleStart args.").
// ObfMapping's static initializer runs that path only while `obfuscated` is
// false, i.e. in dev runs -- production jars are unaffected.
//
// Unimined used to inject these through its `cleanroom` extension. ModDevGradle
// ships an equivalent bridge (ForgeGradleMcpCache), but McpForgeModDevPlugin
// registers it only when CompatibilityProfile#forgeGradle2CacheEnabled() is
// true, and the Cleanroom 1.12.2 platform reports false. `populateForgeGradleMcpCache`
// is therefore never created and the properties stay unset, so GTCEU fails on
// every class transform with an ExceptionInInitializerError storm.
//
// Rebuild the wiring from ModDevGradle's own published artifacts. Do not point
// these at Unimined cache paths; those exist only on developer machines.
def createMcArtifacts = tasks.named('createMinecraftArtifacts')
def mcAdditionalResults = createMcArtifacts.flatMap { it.additionalResults }
def gtceuNotchSrg = mcAdditionalResults.map { it['notchToIntermediaryMapping'] }
def gtceuCsvZip = mcAdditionalResults.map { it['csvMapping'] }
def gtceuCsvDir = layout.buildDirectory.dir('gtceu/mcp-csv')

// The CSV artifact is a zip (fields.csv/methods.csv/params.csv), but GTCEU
// wants a directory, so unpack the two dictionaries it reads.
def extractGtceuMcpCsv = tasks.register('extractGtceuMcpCsv') {
    group = 'ae2gtaddon'
    description = "Unpacks the MCP name dictionaries GTCEU's dev-time remapper reads."
    def csvZipProvider = gtceuCsvZip
    def outputDir = gtceuCsvDir
    inputs.file(csvZipProvider)
    outputs.dir(outputDir)
    doLast {
        File target = outputDir.get().asFile
        target.mkdirs()
        new java.util.zip.ZipFile(csvZipProvider.get()).withCloseable { archive ->
            ['fields.csv', 'methods.csv'].each { String entryName ->
                def entry = archive.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("MCP CSVs are missing ${entryName}")
                }
                new File(target, entryName).withOutputStream { out ->
                    archive.getInputStream(entry).transferTo(out)
                }
            }
        }
    }
}

def scriptProviders = providers
mcpForge {
    runs {
        configureEach {
            systemProperties.putAll(scriptProviders.provider {
                [
                    'net.minecraftforge.gradle.GradleStart.srg.notch-srg': gtceuNotchSrg.get().absolutePath,
                    'net.minecraftforge.gradle.GradleStart.csvDir': gtceuCsvDir.get().asFile.absolutePath
                ]
            })
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn(extractGtceuMcpCsv)
}

def curseforgeProjectId = findProperty('curseforge_project_id')
if (curseforgeProjectId != null && !curseforgeProjectId.toString().isBlank()) {
    curseforgeProjectId = curseforgeProjectId.toString().trim()
    if (!curseforgeProjectId.matches('\\d+')) {
        throw new GradleException(
            "Property curseforge_project_id must be a numeric CurseForge project id: ${curseforgeProjectId}"
        )
    }
    def curseforgeReleaseType = findProperty('curseforge_release_type')
    if (curseforgeReleaseType == null || curseforgeReleaseType.toString().isBlank()) {
        def detectedVersion = propertyString('mod_version').toLowerCase()
        if (detectedVersion.contains('alpha')) {
            curseforgeReleaseType = 'alpha'
        } else if (detectedVersion.contains('beta') || detectedVersion.contains('pre') || detectedVersion.contains('rc')) {
            curseforgeReleaseType = 'beta'
        } else {
            curseforgeReleaseType = 'release'
        }
    } else {
        curseforgeReleaseType = curseforgeReleaseType.toString().toLowerCase().trim()
    }
    if (!['alpha', 'beta', 'release'].contains(curseforgeReleaseType)) {
        throw new GradleException(
            "Property curseforge_release_type must be one of alpha, beta, release: ${curseforgeReleaseType}"
        )
    }

    setDefaultProperty('curseforge_game_versions', false, '1.12.2,Forge,Java 25,Client,Server')
    def curseforgeGameVersions = propertyStringList('curseforge_game_versions', ',')
        .collect { it.trim() }
        .findAll { !it.isBlank() }
    if (curseforgeGameVersions.isEmpty()) {
        throw new GradleException('Property curseforge_game_versions must define at least one CurseForge game version tag!')
    }

    def curseforgeRelationTypes = [
        'curseforge_relations_required': 'requiredDependency',
        'curseforge_relations_optional': 'optionalDependency',
        'curseforge_relations_embedded': 'embeddedLibrary',
        'curseforge_relations_incompatible': 'incompatible',
        'curseforge_relations_tool': 'tool'
    ]
    def curseforgeRelations = [:]
    curseforgeRelationTypes.each { propertyKey, relationType ->
        setDefaultProperty(propertyKey, false, '')
        def slugs = propertyStringList(propertyKey)
        if (!slugs.isEmpty()) {
            curseforgeRelations.put(relationType, slugs)
        }
    }

    def curseforgeChangelogFile = null
    def curseforgeChangelogProperty = findProperty('curseforge_changelog_file')
    if (curseforgeChangelogProperty != null && !curseforgeChangelogProperty.toString().isBlank()) {
        curseforgeChangelogFile = file(curseforgeChangelogProperty.toString())
    } else if (file('CHANGELOG.md').isFile()) {
        curseforgeChangelogFile = file('CHANGELOG.md')
    }
    setDefaultProperty('curseforge_debug_mode', false, 'false')

    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn tasks.named('build')
        group = 'publishing'
        description = "Publishes the production mod jar to CurseForge project ${curseforgeProjectId}."
        apiToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        debugMode = propertyBool('curseforge_debug_mode')
        def mainFile = upload(curseforgeProjectId, productionJarTask.get())
        mainFile.releaseType = curseforgeReleaseType
        mainFile.changelogType = 'markdown'
        if (curseforgeChangelogFile != null) {
            mainFile.changelog = curseforgeChangelogFile
        }
        curseforgeGameVersions.each { mainFile.addGameVersion(it) }
        curseforgeRelations.each { relationType, slugs ->
            mainFile.addRelations(relationType, slugs as String[])
        }
    }

    def curseforgeAddon = file('addon.gradle')
    if (curseforgeAddon.isFile()) {
        apply from: curseforgeAddon
        logger.lifecycle("Applied CurseForge addon script: ${curseforgeAddon}")
    }
}
